<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>All About You</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --cream: #F7F3ED;
    --ink: #1C1917;
    --ink-soft: #57534E;
    --ink-muted: #A8A29E;
    --sage: #4A7C59;
    --sage-light: #EBF2EE;
    --sage-mid: #C4DBCC;
    --coral: #C0614A;
    --coral-light: #FAF0EE;
    --gold: #B08D57;
    --gold-light: #F7F0E6;
    --border: rgba(28,25,23,0.1);
    --radius: 12px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'DM Sans', sans-serif;
    background: var(--cream);
    color: var(--ink);
    min-height: 100vh;
  }

  /* NAV */
  nav {
    display: flex; align-items: center; justify-content: space-between;
    padding: 1.25rem 2rem;
    border-bottom: 1px solid var(--border);
    background: var(--cream);
    position: sticky; top: 0; z-index: 10;
  }
  .nav-logo { font-family: 'DM Serif Display', serif; font-size: 22px; color: var(--ink); }
  .nav-logo span { color: var(--sage); font-style: italic; }
  #auth-btn {
    display: flex; align-items: center; gap: 8px;
    padding: 8px 18px; border-radius: 100px;
    border: 1px solid var(--border);
    background: white; color: var(--ink);
    font-family: 'DM Sans', sans-serif; font-size: 14px; font-weight: 500;
    cursor: pointer; transition: background 0.15s, box-shadow 0.15s;
  }
  #auth-btn:hover { background: var(--sage-light); box-shadow: 0 1px 4px rgba(0,0,0,0.06); }
  #auth-btn img { width: 18px; height: 18px; border-radius: 50%; }

  /* HERO */
  .hero {
    text-align: center; padding: 4rem 2rem 3rem;
    max-width: 640px; margin: 0 auto;
  }
  .hero h1 {
    font-family: 'DM Serif Display', serif;
    font-size: clamp(36px, 6vw, 56px);
    line-height: 1.1; color: var(--ink);
    margin-bottom: 1rem;
  }
  .hero h1 em { color: var(--sage); font-style: italic; }
  .hero p { font-size: 16px; color: var(--ink-soft); line-height: 1.7; margin-bottom: 2rem; }
  .hero-cta {
    display: inline-flex; align-items: center; gap: 10px;
    padding: 14px 28px; border-radius: 100px;
    background: var(--ink); color: var(--cream);
    font-family: 'DM Sans', sans-serif; font-size: 15px; font-weight: 500;
    cursor: pointer; border: none; transition: background 0.15s, transform 0.1s;
  }
  .hero-cta:hover { background: var(--sage); transform: translateY(-1px); }
  .hero-cta svg { width: 18px; height: 18px; }

  /* MAIN LAYOUT */
  .main { max-width: 900px; margin: 0 auto; padding: 2rem; }

  /* SEARCH + ADD */
  .toolbar {
    display: flex; align-items: center; gap: 12px;
    margin-bottom: 1.5rem; flex-wrap: wrap;
  }
  .search-wrap {
    flex: 1; min-width: 200px;
    display: flex; align-items: center; gap: 8px;
    background: white; border: 1px solid var(--border);
    border-radius: 100px; padding: 8px 16px;
  }
  .search-wrap svg { width: 16px; height: 16px; color: var(--ink-muted); flex-shrink: 0; }
  .search-wrap input {
    border: none; outline: none; background: none;
    font-family: 'DM Sans', sans-serif; font-size: 14px; color: var(--ink);
    width: 100%;
  }
  .search-wrap input::placeholder { color: var(--ink-muted); }
  .add-btn {
    display: flex; align-items: center; gap: 6px;
    padding: 10px 20px; border-radius: 100px;
    background: var(--sage); color: white;
    font-family: 'DM Sans', sans-serif; font-size: 14px; font-weight: 500;
    border: none; cursor: pointer; transition: background 0.15s;
    white-space: nowrap;
  }
  .add-btn:hover { background: #3a6347; }

  /* FRIEND GRID */
  .friends-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
    gap: 16px;
  }
  .friend-card {
    background: white; border: 1px solid var(--border);
    border-radius: var(--radius); padding: 1.25rem;
    cursor: pointer; transition: box-shadow 0.15s, transform 0.1s;
    animation: fadeIn 0.3s ease forwards;
  }
  .friend-card:hover { box-shadow: 0 4px 20px rgba(0,0,0,0.08); transform: translateY(-2px); }
  .friend-card.selected { border-color: var(--sage); box-shadow: 0 0 0 3px var(--sage-mid); }
  @keyframes fadeIn { from { opacity:0; transform: translateY(8px); } to { opacity:1; transform: translateY(0); } }
  .card-top { display: flex; align-items: center; gap: 12px; margin-bottom: 12px; }
  .avatar {
    width: 44px; height: 44px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-family: 'DM Serif Display', serif; font-size: 16px; flex-shrink: 0;
  }
  .card-name { font-weight: 500; font-size: 15px; color: var(--ink); }
  .card-meta { font-size: 12px; color: var(--ink-muted); margin-top: 2px; }
  .tag-row { display: flex; flex-wrap: wrap; gap: 5px; }
  .tag {
    font-size: 11px; padding: 3px 10px; border-radius: 100px;
    font-weight: 400; letter-spacing: 0.01em;
  }
  .tag.like { background: var(--sage-light); color: var(--sage); }
  .tag.dislike { background: var(--coral-light); color: var(--coral); }

  /* DETAIL PANEL */
  .detail-panel {
    background: white; border: 1px solid var(--border);
    border-radius: var(--radius); padding: 1.5rem;
    margin-top: 1.5rem; display: none;
  }
  .detail-panel.open { display: block; animation: fadeIn 0.25s ease; }
  .panel-header { display: flex; align-items: center; gap: 14px; margin-bottom: 1.5rem; padding-bottom: 1.25rem; border-bottom: 1px solid var(--border); }
  .panel-avatar { width: 56px; height: 56px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-family: 'DM Serif Display', serif; font-size: 20px; flex-shrink: 0; }
  .panel-name { font-family: 'DM Serif Display', serif; font-size: 22px; color: var(--ink); }
  .panel-note { font-size: 13px; color: var(--ink-muted); margin-top: 3px; }
  .close-btn { margin-left: auto; background: none; border: 1px solid var(--border); border-radius: 100px; padding: 6px 14px; font-size: 13px; color: var(--ink-soft); cursor: pointer; font-family: 'DM Sans', sans-serif; }
  .close-btn:hover { background: var(--cream); }
  .pref-cols { display: grid; grid-template-columns: 1fr 1fr; gap: 1.5rem; }
  @media (max-width: 520px) { .pref-cols { grid-template-columns: 1fr; } }
  .pref-section h3 {
    font-size: 12px; font-weight: 500; letter-spacing: 0.08em; text-transform: uppercase;
    color: var(--ink-muted); margin-bottom: 10px;
    display: flex; align-items: center; gap: 6px;
  }
  .pref-section h3 .dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
  .dot-like { background: var(--sage); }
  .dot-dislike { background: var(--coral); }
  .pref-list { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 10px; min-height: 28px; }
  .pref-tag {
    display: flex; align-items: center; gap: 5px;
    font-size: 13px; padding: 4px 10px 4px 12px; border-radius: 100px;
  }
  .pref-tag.like { background: var(--sage-light); color: var(--sage); }
  .pref-tag.dislike { background: var(--coral-light); color: var(--coral); }
  .pref-tag button { background: none; border: none; cursor: pointer; padding: 0; font-size: 15px; line-height: 1; opacity: 0.5; }
  .pref-tag button:hover { opacity: 1; }
  .add-pref { display: flex; gap: 6px; }
  .add-pref input {
    flex: 1; padding: 7px 12px; border-radius: 100px;
    border: 1px solid var(--border); background: var(--cream);
    font-family: 'DM Sans', sans-serif; font-size: 13px; color: var(--ink); outline: none;
  }
  .add-pref input:focus { border-color: var(--sage); }
  .add-pref button {
    padding: 7px 14px; border-radius: 100px; border: none;
    font-family: 'DM Sans', sans-serif; font-size: 13px; font-weight: 500;
    cursor: pointer;
  }
  .btn-like { background: var(--sage); color: white; }
  .btn-like:hover { background: #3a6347; }
  .btn-dislike { background: var(--coral); color: white; }
  .btn-dislike:hover { background: #a34f3b; }
  .panel-footer { margin-top: 1.5rem; padding-top: 1.25rem; border-top: 1px solid var(--border); display: flex; justify-content: flex-end; }
  .delete-btn { background: none; border: 1px solid var(--border); border-radius: 100px; padding: 6px 14px; font-size: 13px; color: var(--ink-muted); cursor: pointer; font-family: 'DM Sans', sans-serif; }
  .delete-btn:hover { color: var(--coral); border-color: var(--coral); }

  /* MODAL */
  .modal-overlay {
    display: none; position: fixed; inset: 0;
    background: rgba(28,25,23,0.4); z-index: 100;
    align-items: center; justify-content: center;
  }
  .modal-overlay.open { display: flex; }
  .modal {
    background: white; border-radius: var(--radius);
    padding: 2rem; width: 90%; max-width: 400px;
    animation: fadeIn 0.2s ease;
  }
  .modal h2 { font-family: 'DM Serif Display', serif; font-size: 22px; margin-bottom: 1.25rem; }
  .field { margin-bottom: 14px; }
  .field label { display: block; font-size: 12px; font-weight: 500; letter-spacing: 0.06em; text-transform: uppercase; color: var(--ink-muted); margin-bottom: 6px; }
  .field input {
    width: 100%; padding: 10px 14px; border-radius: 8px;
    border: 1px solid var(--border); background: var(--cream);
    font-family: 'DM Sans', sans-serif; font-size: 14px; color: var(--ink); outline: none;
  }
  .field input:focus { border-color: var(--sage); }
  .modal-actions { display: flex; gap: 10px; margin-top: 1.5rem; }
  .modal-actions button { flex: 1; padding: 11px; border-radius: 100px; font-family: 'DM Sans', sans-serif; font-size: 14px; font-weight: 500; cursor: pointer; border: 1px solid var(--border); }
  .btn-primary { background: var(--ink); color: var(--cream); border-color: var(--ink); }
  .btn-primary:hover { background: var(--sage); border-color: var(--sage); }
  .btn-secondary { background: white; color: var(--ink); }
  .btn-secondary:hover { background: var(--cream); }

  /* STATES */
  .empty-state { text-align: center; padding: 4rem 2rem; color: var(--ink-muted); }
  .empty-state svg { width: 48px; height: 48px; margin: 0 auto 1rem; display: block; opacity: 0.3; }
  .empty-state p { font-size: 15px; line-height: 1.6; }
  .loading { text-align: center; padding: 4rem; color: var(--ink-muted); font-size: 15px; }
  #signed-out-view { display: block; }
  #signed-in-view { display: none; }
  .toast {
    position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
    background: var(--ink); color: var(--cream); padding: 10px 20px;
    border-radius: 100px; font-size: 13px; z-index: 200;
    opacity: 0; transition: opacity 0.3s; pointer-events: none;
  }
  .toast.show { opacity: 1; }

  /* AVATAR COLORS */
  .av-0 { background: #EBF2EE; color: #4A7C59; }
  .av-1 { background: #E6EEF7; color: #3A5F8A; }
  .av-2 { background: #FAF0EE; color: #C0614A; }
  .av-3 { background: #F7F0E6; color: #B08D57; }
  .av-4 { background: #F2EBF7; color: #7A4A8A; }
  .av-5 { background: #EBF7F2; color: #2A7A62; }
</style>
</head>
<body>

<nav>
  <div class="nav-logo">all about <span>you</span></div>
  <button id="auth-btn">Sign in with Google</button>
</nav>

<div id="signed-out-view">
  <div class="hero">
    <h1>What do your friends <em>actually</em> love?</h1>
    <p>A shared space where your friends can tell you — and each other — exactly what they like and dislike. Perfect for gifts, plans, and just knowing your people.</p>
    <button class="hero-cta" onclick="signIn()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4M10 17l5-5-5-5M13 12H3"/></svg>
      Sign in to get started
    </button>
  </div>
</div>

<div id="signed-in-view">
  <div class="main">
    <div class="toolbar">
      <div class="search-wrap">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
        <input id="search" type="text" placeholder="Search friends or preferences…" oninput="renderCards()">
      </div>
      <button class="add-btn" onclick="openModal()">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 5v14M5 12h14"/></svg>
        Add friend
      </button>
    </div>
    <div id="friends-grid" class="friends-grid">
      <div class="loading">Loading friends…</div>
    </div>
    <div class="detail-panel" id="detail-panel"></div>
  </div>
</div>

<!-- ADD FRIEND MODAL -->
<div class="modal-overlay" id="modal">
  <div class="modal">
    <h2>Add a friend</h2>
    <div class="field"><label>Name</label><input id="m-name" type="text" placeholder="e.g. Jamie Lee"></div>
    <div class="field"><label>Note (optional)</label><input id="m-note" type="text" placeholder="e.g. college friend, sister…"></div>
    <div class="modal-actions">
      <button class="btn-secondary" onclick="closeModal()">Cancel</button>
      <button class="btn-primary" onclick="addFriend()">Add friend</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<!-- FIREBASE -->
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
import { getFirestore, collection, getDocs, addDoc, updateDoc, deleteDoc, doc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyCPFKQtyzcU_poQxKwt4ZqyHQZaD0P7eBo",
  authDomain: "all-about-you-adeb7.firebaseapp.com",
  projectId: "all-about-you-adeb7",
  storageBucket: "all-about-you-adeb7.firebasestorage.app",
  messagingSenderId: "10842317132",
  appId: "1:10842317132:web:7793e64e7a9b73dafcefe9"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

let friends = [];
let selectedId = null;
let unsubscribe = null;

// AUTH
window.signIn = async () => {
  try {
    await signInWithPopup(auth, new GoogleAuthProvider());
  } catch(e) { showToast('Sign in failed. Please try again.'); }
};

window.signOut2 = async () => {
  if(unsubscribe) unsubscribe();
  await signOut(auth);
};

onAuthStateChanged(auth, user => {
  if(user) {
    document.getElementById('signed-out-view').style.display = 'none';
    document.getElementById('signed-in-view').style.display = 'block';
    document.getElementById('auth-btn').innerHTML = `<img src="${user.photoURL||''}" onerror="this.style.display='none'"> Sign out`;
    document.getElementById('auth-btn').onclick = window.signOut2;
    startListening();
  } else {
    document.getElementById('signed-out-view').style.display = 'block';
    document.getElementById('signed-in-view').style.display = 'none';
    document.getElementById('auth-btn').innerHTML = 'Sign in with Google';
    document.getElementById('auth-btn').onclick = window.signIn;
    friends = [];
  }
});

// FIRESTORE LIVE LISTENER
function startListening() {
  unsubscribe = onSnapshot(collection(db, 'friends'), snap => {
    friends = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    renderCards();
    if(selectedId) {
      const still = friends.find(f => f.id === selectedId);
      if(still) renderDetail(still);
    }
  });
}

// ADD FRIEND
window.addFriend = async () => {
  const name = document.getElementById('m-name').value.trim();
  if(!name) { showToast('Please enter a name.'); return; }
  const note = document.getElementById('m-note').value.trim();
  const colors = ['av-0','av-1','av-2','av-3','av-4','av-5'];
  const avatar = colors[Math.floor(Math.random() * colors.length)];
  await addDoc(collection(db, 'friends'), { name, note, avatar, likes: [], dislikes: [] });
  closeModal();
  showToast(`${name} added!`);
};

// ADD PREF
window.addPref = async (id, type) => {
  const inp = document.getElementById(`inp-${type}-${id}`);
  const val = inp.value.trim();
  if(!val) return;
  const f = friends.find(x => x.id === id);
  if(!f) return;
  const updated = [...(f[type]||[])];
  if(!updated.includes(val)) {
    updated.push(val);
    await updateDoc(doc(db, 'friends', id), { [type]: updated });
  }
  inp.value = '';
};

// REMOVE PREF
window.removePref = async (id, type, idx) => {
  const f = friends.find(x => x.id === id);
  if(!f) return;
  const updated = [...(f[type]||[])];
  updated.splice(idx, 1);
  await updateDoc(doc(db, 'friends', id), { [type]: updated });
};

// DELETE FRIEND
window.deleteFriend = async (id) => {
  if(!confirm('Remove this friend?')) return;
  await deleteDoc(doc(db, 'friends', id));
  selectedId = null;
  document.getElementById('detail-panel').className = 'detail-panel';
  showToast('Friend removed.');
};

// RENDER
window.renderCards = () => {
  const q = document.getElementById('search').value.toLowerCase();
  const grid = document.getElementById('friends-grid');
  const filtered = friends.filter(f => {
    if(!q) return true;
    return f.name.toLowerCase().includes(q) ||
      (f.likes||[]).some(l => l.toLowerCase().includes(q)) ||
      (f.dislikes||[]).some(d => d.toLowerCase().includes(q));
  });
  if(!filtered.length) {
    grid.innerHTML = `<div class="empty-state" style="grid-column:1/-1">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 3.6-7 8-7s8 3 8 7"/></svg>
      <p>${friends.length === 0 ? 'No friends yet.<br>Add someone to get started!' : 'No matches found.'}</p>
    </div>`;
    return;
  }
  grid.innerHTML = filtered.map(f => {
    const init = f.name.split(' ').map(w=>w[0]).join('').slice(0,2).toUpperCase();
    const likeTags = (f.likes||[]).slice(0,3).map(l=>`<span class="tag like">${l}</span>`).join('');
    const dislikeTags = (f.dislikes||[]).slice(0,2).map(d=>`<span class="tag dislike">${d}</span>`).join('');
    const sel = selectedId === f.id ? ' selected' : '';
    return `<div class="friend-card${sel}" onclick="openDetail('${f.id}')">
      <div class="card-top">
        <div class="avatar ${f.avatar||'av-0'}">${init}</div>
        <div>
          <div class="card-name">${f.name}</div>
          <div class="card-meta">${f.note||'Friend'} · ${(f.likes||[]).length} likes · ${(f.dislikes||[]).length} dislikes</div>
        </div>
      </div>
      <div class="tag-row">${likeTags}${dislikeTags}</div>
    </div>`;
  }).join('');
};

window.openDetail = (id) => {
  selectedId = id;
  const f = friends.find(x => x.id === id);
  if(f) renderDetail(f);
  renderCards();
};

function renderDetail(f) {
  const init = f.name.split(' ').map(w=>w[0]).join('').slice(0,2).toUpperCase();
  const panel = document.getElementById('detail-panel');
  panel.className = 'detail-panel open';
  panel.innerHTML = `
    <div class="panel-header">
      <div class="panel-avatar ${f.avatar||'av-0'}">${init}</div>
      <div>
        <div class="panel-name">${f.name}</div>
        <div class="panel-note">${f.note||'No note'}</div>
      </div>
      <button class="close-btn" onclick="closeDetail()">Close</button>
    </div>
    <div class="pref-cols">
      <div class="pref-section">
        <h3><span class="dot dot-like"></span>Likes</h3>
        <div class="pref-list">
          ${(f.likes||[]).map((l,i)=>`<span class="pref-tag like">${l}<button onclick="removePref('${f.id}','likes',${i})" aria-label="Remove">×</button></span>`).join('')||'<span style="font-size:13px;color:var(--ink-muted)">Nothing yet</span>'}
        </div>
        <div class="add-pref">
          <input id="inp-likes-${f.id}" type="text" placeholder="Add a like…" onkeydown="if(event.key==='Enter')addPref('${f.id}','likes')">
          <button class="btn-like" onclick="addPref('${f.id}','likes')">Add</button>
        </div>
      </div>
      <div class="pref-section">
        <h3><span class="dot dot-dislike"></span>Dislikes</h3>
        <div class="pref-list">
          ${(f.dislikes||[]).map((d,i)=>`<span class="pref-tag dislike">${d}<button onclick="removePref('${f.id}','dislikes',${i})" aria-label="Remove">×</button></span>`).join('')||'<span style="font-size:13px;color:var(--ink-muted)">Nothing yet</span>'}
        </div>
        <div class="add-pref">
          <input id="inp-dislikes-${f.id}" type="text" placeholder="Add a dislike…" onkeydown="if(event.key==='Enter')addPref('${f.id}','dislikes')">
          <button class="btn-dislike" onclick="addPref('${f.id}','dislikes')">Add</button>
        </div>
      </div>
    </div>
    <div class="panel-footer">
      <button class="delete-btn" onclick="deleteFriend('${f.id}')">Remove friend</button>
    </div>
  `;
}

window.closeDetail = () => {
  selectedId = null;
  document.getElementById('detail-panel').className = 'detail-panel';
  renderCards();
};

// MODAL
window.openModal = () => { document.getElementById('modal').classList.add('open'); document.getElementById('m-name').focus(); };
window.closeModal = () => { document.getElementById('modal').classList.remove('open'); document.getElementById('m-name').value=''; document.getElementById('m-note').value=''; };
document.getElementById('modal').addEventListener('click', e => { if(e.target===document.getElementById('modal')) closeModal(); });

// TOAST
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), 2500);
}
</script>
</body>
